# Registro delle fonti dati. Documentazione + stato di abilitazione.
# Il binding source_id -> classe Connector vive in pipeline.py:REGISTRY.
# Il campo "portale" (URL pubblico verificato) e "stato" alimentano la pagina /fonti.
# Le voci "pianificata" sono fonti censite ma non ancora collegate:
# tutte queste regioni HANNO una rete di monitoraggio (Rete Idrografica
# Nazionale) — "in studio" significa che il formato online del feed non e'
# stato ancora analizzato per scrivere il connector.

sources:
  - id: abr
    regione: Abruzzo
    ente: Protezione Civile Regione Abruzzo — Centro Funzionale
    tipo: in studio
    stato: pianificata
    portale: https://protezionecivile.regione.abruzzo.it
    note: rete idrometeo del Centro Funzionale regionale (URL verificato 2026-11-16)

  - id: aa
    regione: Alto Adige
    ente: Provincia Autonoma di Bolzano
    tipo: JSON/API (rete idrometrica provinciale)
    stato: pianificata
    portale: https://weather.province.bz.it
    note: >
      stazioni di misurazione dei livelli (Adige, Isarco e bacini provinciali);
      la pagina dedicata alle stazioni si raggiunge dal portale (path da confermare)

  - id: bas
    regione: Basilicata
    ente: Centro Funzionale Decentrato Basilicata
    tipo: in studio
    stato: pianificata
    portale: https://centrofunzionale.regione.basilicata.it
    note: rete di monitoraggio per il rischio idrogeologico e idraulico (dominio .it)

  - id: cal
    regione: Calabria
    ente: Centro Funzionale Multirischi Calabria
    tipo: in studio
    stato: pianificata
    portale: https://www.regione.calabria.it
    note: >
      rete idrometeo del CF multirischi; il sottodominio dedicato risulta
      irraggiungibile, si parte dal portale regionale

  - id: cam
    regione: Campania
    ente: Centro Funzionale Campania
    tipo: in studio
    stato: pianificata
    portale: https://centrofunzionale.regione.campania.it
    note: stato di allerta e rete di monitoraggio idrometeo regionale (URL verificato)

  - id: er
    regione: Emilia-Romagna
    ente: Arpae / AllertaMeteo Regione ER
    tipo: JSON (telemisura 15 min)
    stato: attiva
    portale: https://allertameteo.regione.emilia-romagna.it/livello-idrometrico
    endpoints:
      valori_sensori: >-
        https://allertameteo.regione.emilia-romagna.it/o/api/allerta/get-sensor-values
        ?variabile=254,0,0/1,-,-,-/B13215&time={epoch_ms_slot_15min}
      serie_stazione: >-
        https://allertameteo.regione.emilia-romagna.it/o/api/allerta/get-time-series/
        ?stazione={idstazione}&variabile=254,0,0/1,-,-,-/B13215
    note: >
      Endpoint non documentato ufficialmente (la guida /sviluppatori copre solo le
      allerte), ricavato dal traffico del portale. Senza il parametro time
      (epoch ms arrotondato a 15 minuti) i value arrivano tutti null. Coordinate
      come gradi decimali x100000. Incluse anche stazioni lago/diga: da filtrare.
    licenza: dati Arpae, citare la fonte

  - id: fvg
    regione: Friuli-Venezia Giulia
    ente: ARPA FVG — Osservatorio Meteo
    tipo: in studio
    stato: pianificata
    portale: https://www.meteo.fvg.it
    note: reti idro-meteo della Regione Autonoma Friuli-Venezia Giulia (URL verificato)

  - id: laz
    regione: Lazio
    ente: Ufficio Idrografico e Mareografico di Roma
    tipo: in studio
    stato: pianificata
    portale: http://www.idrografico.roma.it
    note: rete idro-termo-pluviometrica regionale, anche su dati.lazio.it (http non https)

  - id: lig
    regione: Liguria
    ente: Centro Funzionale Meteo Idrografico Liguria
    tipo: in studio
    stato: pianificata
    portale: https://www.regione.liguria.it
    note: >
      rete di monitoraggio idrometeo; il dominio storico cfmeteo.regione.liguria.it
      risulta non risolto, si parte dal portale regionale

  - id: lom
    regione: Lombardia
    ente: ARPA Lombardia
    tipo: JSON/CSV (open data Socrata — dati.lombardia.it)
    stato: pianificata
    portale: https://www.arpalombardia.it
    note: >
      sensori di livello idrometrico pubblicati in open data Socrata
      (dati.lombardia.it): dataset per singolo sensore con API JSON e CSV

  - id: mar
    regione: Marche
    ente: Centro Funzionale Marche
    tipo: in studio
    stato: pianificata
    portale: https://centrofunzionale.regione.marche.it
    note: >
      rete idrometeo regionale del Centro Funzionale (il server risponde
      lentamente o blocca client non-browser: URL da confermare in browser)

  - id: mol
    regione: Molise
    ente: Protezione Civile Molise — Centro Funzionale
    tipo: in studio
    stato: pianificata
    portale: https://www.regione.molise.it
    note: rete di monitoraggio idrogeologico regionale, sezione dal portale regionale

  - id: pie
    regione: Piemonte
    ente: ARPA Piemonte
    tipo: in studio
    stato: pianificata
    portale: https://www.arpa.piemonte.it
    note: reti idrometriche e pluviometriche (Sistema di Allerta regionale)

  - id: pug
    regione: Puglia
    ente: Protezione Civile Puglia — Centro Funzionale
    tipo: in studio
    stato: pianificata
    portale: https://protezionecivile.regione.puglia.it
    note: rete di monitoraggio per il rischio idraulico e idrogeologico (URL verificato)

  - id: sar
    regione: Sardegna
    ente: Regione Sardegna — Rete Idrografica (SAR)
    tipo: in studio
    stato: pianificata
    portale: https://www.sar.sardegna.it
    note: rete idrografica regionale, dati anche via PDND/api.gov.it (URL verificato)

  - id: sic
    regione: Sicilia
    ente: Osservatorio delle Acque — Regione Siciliana
    tipo: in studio
    stato: pianificata
    portale: https://www.osservatorioacque.it
    note: rete idrografica siciliana (annali e dati in tempo reale) (URL verificato)

  - id: tos
    regione: Toscana
    ente: Centro Funzionale Toscana
    tipo: in studio
    stato: pianificata
    portale: https://www.cfr.toscana.it
    note: soglie idrometriche di riferimento e rete di monitoraggio regionale (URL verificato)

  - id: tre
    regione: Trentino
    ente: MeteoTrentino / dati.trentino.it
    tipo: CSV (CKAN)
    stato: pianificata
    portale: https://dati.trentino.it/dataset/rilevamento-sensori-idrometrici-livello
    note: rilevamento sensori idrometrici, open data provincia autonoma di Trento (URL verificato)

  - id: umb
    regione: Umbria
    ente: Regione Umbria — Centro Funzionale
    tipo: CSV (open data CKAN)
    stato: pianificata
    portale: https://dati.regione.umbria.it
    note: rete di monitoraggio idro-termo-pluviometrica, open data CC-BY (URL verificato)

  - id: vda
    regione: Valle d'Aosta
    ente: Centro Funzionale Valle d'Aosta
    tipo: in studio
    stato: pianificata
    portale: https://cf.regione.vda.it
    note: reti idrometeo della Regione Autonoma Valle d'Aosta (URL verificato)

  - id: ve
    regione: Veneto
    ente: ARPAV
    tipo: XML (feed open data)
    stato: pianificata
    portale: https://www.arpa.veneto.it/dati-ambientali/dati-in-diretta/meteo-idro-nivo/livelloidrometrico
    note: feed open data rete idrometrica (~146 stazioni)

  - id: dpc
    regione: Nazionale
    ente: Dipartimento Protezione Civile
    tipo: JSON (bollettini criticità)
    stato: pianificata
    portale: https://github.com/pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica
    note: bollettini di criticità idraulica e idrogeologica nazionali, 2 emissioni/giorno

  - id: glofas
    regione: Nazionale (baseline storica)
    ente: Copernicus EMS / GloFAS
    tipo: API (rianalisi portate)
    stato: pianificata
    portale: https://global-flood-database.ecmwf.int
    note: rianalisi portate 1991-oggi, baseline percentili dove manca l'osservato
