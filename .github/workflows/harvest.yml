name: harvest
on:
  schedule:
    - cron: "13,43 * * * *"   # minuti insoliti: GitHub strozza i cron su :00/:30
  workflow_dispatch:

permissions:
  contents: write             # commit dei dati sul repo stesso

# Condiviso con nightly: un solo job alla volta scrive idrogramma.db,
# cosi' due run non si pestano i piedi sul push.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py harvest

      # Fase skeleton: il DB viaggia nel repo (in produzione -> Cloudflare D1).
      - name: commit dati
        run: |
          git config user.name "idrogramma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add idrogramma.db frontend/static/data
          if git diff --cached --quiet; then
            echo "nessun dato nuovo"
          else
            git commit -m "dati $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
