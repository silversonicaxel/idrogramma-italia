name: nightly
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Condiviso con harvest: un solo job alla volta scrive idrogramma.db.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  percentilei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py nightly
      - name: commit dati
        run: |
          git config user.name "idrogramma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add idrogramma.db frontend/static/data
          if git diff --cached --quiet; then
            echo "nessun dato nuovo"
          else
            git commit -m "percentili $(date -u '+%Y-%m-%d') UTC"
            git pull --rebase
            git push
          fi
